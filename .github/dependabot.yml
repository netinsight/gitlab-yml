version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 3
      ignore:
          - dependency-name: "*"
            update-types:
                - "version-update:semver-minor"
                - "version-update:semver-patch"
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 3
